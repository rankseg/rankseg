name: Build distributions

on:
  push:
    branches: [main, master]
    paths-ignore:
      - .gitignore
      - "doc/**"
      - .readthedocs.yaml
  pull_request:
    branches: [main, master]
    paths-ignore:
      - .gitignore
      - "doc/**"
      - .readthedocs.yaml
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: python -m pip install --upgrade build twine "readme_renderer[md]"

      - name: Build wheel and sdist
        run: python -m build

      - name: Check distributions
        run: |
          python -m twine check --strict dist/*
          python scripts/check_distributions.py dist

      - name: Install and smoke-test distributions without Triton
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail

          python -m venv "$RUNNER_TEMP/rankseg-cpu-smoke"
          cpu_python="$RUNNER_TEMP/rankseg-cpu-smoke/bin/python"
          "$cpu_python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu

          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          sdists=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1

          for artifact in "${wheels[0]}" "${sdists[0]}"; do
            # Do not reuse a cached wheel when checking the sdist of the same version.
            "$cpu_python" -m pip install --no-cache-dir "$artifact"
            "$cpu_python" -m pip check
            "$cpu_python" -I "$GITHUB_WORKSPACE/scripts/smoke_test_distribution.py" \
              --artifact "$artifact" --source-root "$GITHUB_WORKSPACE" \
              --device cpu --require-no-triton
            "$cpu_python" -m pip uninstall --yes rankseg
          done

      - name: Run tests from the packaged source
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          cpu_python="$RUNNER_TEMP/rankseg-cpu-smoke/bin/python"
          "$cpu_python" -m pip install pytest pytest-cov torchmetrics
          sdists=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          test "${#sdists[@]}" -eq 1
          rankseg_sdist_dir="$(mktemp -d)"
          tar -xzf "${sdists[0]}" -C "$rankseg_sdist_dir"
          sources=("$rankseg_sdist_dir"/rankseg-*)
          test "${#sources[@]}" -eq 1
          cd "${sources[0]}"
          "$cpu_python" -m pytest --cov-config=.coveragerc.cpu

      - uses: actions/upload-artifact@v4
        with:
          name: rankseg-dist
          path: dist/*
          if-no-files-found: error
