experiment:
  name: monai_pr8908_pancreas_rankseg
  seed: 8908
  no_retraining_or_finetuning: true

dataset:
  name: Medical Segmentation Decathlon Task07 Pancreas
  source: https://medicaldecathlon.com/
  mirror_repo: Angelou0516/msd-pancreas
  data_dir: data/msd_hf/Task07_Pancreas
  split: bundle_seed_123_validation_first_20_sorted_case_ids
  split_note: >-
    Reproduces the bundle prepare_datalist.py split (281 sorted labels,
    train_size=196, MONAI determinism seed 123), then takes the first 20
    validation IDs in numeric order. The IDs are fixed below before evaluation.
  case_ids:
    - pancreas_010
    - pancreas_016
    - pancreas_041
    - pancreas_042
    - pancreas_043
    - pancreas_048
    - pancreas_056
    - pancreas_058
    - pancreas_064
    - pancreas_070
    - pancreas_092
    - pancreas_102
    - pancreas_107
    - pancreas_117
    - pancreas_127
    - pancreas_138
    - pancreas_148
    - pancreas_160
    - pancreas_191
    - pancreas_204
  class_names:
    - background
    - pancreas
    - tumor
  include_background: false
  empty_class_policy: perfect_if_both_empty_otherwise_zero

model:
  name: pancreas_ct_dints_segmentation
  bundle_version: 0.5.2
  bundle_dir: data/monai_bundles/pancreas_ct_dints_segmentation
  checkpoint: models/model.pt
  architecture_checkpoint: models/search_code_18590.pt
  checkpoint_sha256: a18ae8b837f6affe778d7e9f130e6045c04a6f7d5b5dd8470155b9a18b6bcb65
  architecture_checkpoint_sha256: 5049f457b4cdbee036faf56ff5445c633300128d582731e6364c97fa3dc8a515
  roi_size: [96, 96, 96]
  sw_batch_size: 2
  overlap: 0.625

software:
  monai_pr: https://github.com/Project-MONAI/MONAI/pull/8908
  monai_source_commit: fcee761a3280cd740753331a913a65fa0d90ba89
  rankseg: 0.0.5
  torch: 2.12.0

decoding:
  methods:
    argmax:
      argmax: true
    rankdice:
      rankseg: true
      metric: dice
    rankiou:
      rankseg: true
      metric: iou
  device: cuda:0
  warmup: 5
  repetitions: 10

metrics:
  bootstrap_repetitions: 10000
  confidence_level: 0.95

outputs:
  directory: experiments/monai-pr-8908-reproducibility/outputs
  probabilities: experiments/monai-pr-8908-reproducibility/outputs/probabilities
  probability_dtype: float32
  image_dtype: float16
